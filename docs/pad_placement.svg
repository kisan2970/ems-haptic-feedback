<text x="490" y="402" font-size="13" text-anchor="middle" fill="#2a5a9e" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">손가락 폄근 (여기만 자극되면 손가락이 펴짐)</text>
<circle cx="160" cy="248" r="15" fill="#e8d8c6" stroke="#8a6a4a" stroke-width="3"/>
<line x1="160" y1="232" x2="140" y2="170" stroke="#8a6a4a" stroke-width="2"/>
