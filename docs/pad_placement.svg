<text x="860" y="208" font-size="15" text-anchor="middle" fill="#7a4d2c" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">엄지</text>
<text x="840" y="440" font-size="15" text-anchor="middle" fill="#7a4d2c" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >손등</text>
<text x="720" y="236" font-size="15" text-anchor="end" fill="#7a4d2c" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">엄지 쪽 (요측)</text>
<text x="670" y="433.78181818181815" font-size="15" text-anchor="end" fill="#7a4d2c" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">새끼손가락 쪽 (척측)</text>
<text x="60" y="200" font-size="14" text-anchor="start" fill="#7a4d2c" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >위팔</text>
<path d="M150,236 Q342.0,241.0 534,279.0 L534,321.0 Q342.0,337.0 150,320 Z" fill="#e74c3c40" />
