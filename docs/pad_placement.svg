<text x="281.0" y="312" font-size="12" text-anchor="middle" fill="#1e3a56" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >(근위)</text>
<rect x="391.0" y="252.0" width="132" height="88" rx="12" fill="#ffffffcc" stroke="#44617e" stroke-width="3" filter="url(#sh)"/>
<rect x="399.0" y="260.0" width="116" height="72" rx="8" fill="#8fa7bf88"/>
<text x="457.0" y="298" font-size="22" text-anchor="middle" fill="#1e3a56" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">패드 B</text>
<text x="457.0" y="320" font-size="12" text-anchor="middle" fill="#1e3a56" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >(원위)</text>
<text x="533.0" y="274" font-size="15" text-anchor="start" fill="#a93226" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">← 손목 신전근</text>
<text x="533.0" y="294" font-size="14" text-anchor="start" fill="#a93226" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">    여기를 자극</text>
