<text x="615.0" y="195" font-size="13" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">← 리드 B (검정)</text>
<line x1="160" y1="490" x2="281.0" y2="490" stroke="#1d6b35" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>
<line x1="160" y1="480" x2="160" y2="500" stroke="#1d6b35" stroke-width="2"/><line x1="281.0" y1="480" x2="281.0" y2="500" stroke="#1d6b35" stroke-width="2"/>
<text x="220.5" y="482" font-size="14" text-anchor="middle" fill="#1d6b35" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">패드 A 중심까지 약 5~6cm</text>
<line x1="347.0" y1="536" x2="391.0" y2="536" stroke="#1d6b35" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>
<line x1="347.0" y1="526" x2="347.0" y2="546" stroke="#1d6b35" stroke-width="2"/><line x1="391.0" y1="526" x2="391.0" y2="546" stroke="#1d6b35" stroke-width="2"/>
<text x="369.0" y="528" font-size="14" text-anchor="middle" fill="#1d6b35" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">패드 사이 2cm 이상</text>
<line x1="281.0" y1="582" x2="457.0" y2="582" stroke="#1d6b35" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"/>
<line x1="281.0" y1="572" x2="281.0" y2="592" stroke="#1d6b35" stroke-width="2"/><line x1="457.0" y1="572" x2="457.0" y2="592" stroke="#1d6b35" stroke-width="2"/>
<text x="369.0" y="574" font-size="14" text-anchor="middle" fill="#1d6b35" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">중심 사이 약 8cm</text>
<line x1="160" y1="320" x2="160" y2="582" stroke="#1d6b35" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="281.0" y1="320" x2="281.0" y2="582" stroke="#1d6b35" stroke-width="1" stroke-dasharray="4,4"/>
<line x1="457.0" y1="320" x2="457.0" y2="582" stroke="#1d6b35" stroke-width="1" stroke-dasharray="4,4"/>
<text x="690" y="530" font-size="13" text-anchor="end" fill="#777" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >손목까지 약 25cm</text>
<rect x="1000" y="120" width="475" height="430" rx="14" fill="#fff" stroke="#cfc6b4" stroke-width="1.5"/>
<text x="1020" y="156" font-size="19" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">자세 (옆에서 본 모습)</text>
<rect x="1030" y="290" width="270" height="16" fill="#b08a5a"/><rect x="1040" y="306" width="14" height="70" fill="#8a6a40"/>
<path d="M1040,270 L1300,276 L1300,290 L1040,290 Z" fill="#f3d3bb" stroke="#c99a7a" stroke-width="2"/>
<path d="M1300,276 Q1350,278 1380,298 L1372,310 Q1340,296 1300,290 Z" fill="#f3d3bb" stroke="#c99a7a" stroke-width="2"/>
<path d="M1300,276 Q1350,258 1382,232 L1392,242 Q1355,272 1300,290" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
<path d="M1400,295 Q1425,260 1402,230" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/>
<text x="1420" y="220" font-size="13" text-anchor="middle" fill="#c0392b" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">자극하면</text>
<text x="1420" y="204" font-size="13" text-anchor="middle" fill="#c0392b" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">손목이 위로</text>
<rect x="1120" y="264" width="40" height="8" rx="2" fill="#8fa7bf"/><rect x="1190" y="265" width="40" height="8" rx="2" fill="#8fa7bf"/>
<text x="1175" y="256" font-size="12" text-anchor="middle" fill="#44617e" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">패드는 팔 윗면</text>
<text x="1030" y="410" font-size="14" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >• 손바닥이 아래, 손목부터 끝은 책상 밖으로</text>
<text x="1030" y="434" font-size="14" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >• 손과 팔에 힘을 빼고 그대로 둔다</text>
<text x="1020" y="476" font-size="17" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">근육 찾는 법</text>
<text x="1030" y="502" font-size="14" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >주먹을 가볍게 쥐고 손등을 위로 젖히면</text>
<text x="1030" y="524" font-size="14" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >팔꿈치 아래 엄지 쪽 윗면이 볼록 솟는다 → 그 위</text>
<rect x="40" y="700" width="900" height="350" rx="14" fill="#fff" stroke="#cfc6b4" stroke-width="1.5"/>
<text x="60" y="736" font-size="19" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">켜 보고 반응에 따라 옮기기 (노브를 0으로 돌린 뒤 옮긴다)</text>
<circle cx="70" cy="773" r="5" fill="#1d6b35"/>
<text x="86" y="778" font-size="15" text-anchor="start" fill="#1d6b35" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">손목이 위로 젖혀짐</text>
<text x="370" y="778" font-size="15" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >→ 정상. 이 위치를 사진으로 기록</text>
<circle cx="70" cy="811" r="5" fill="#a93226"/>
<text x="86" y="816" font-size="15" text-anchor="start" fill="#a93226" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">손가락만 펴짐</text>
<text x="370" y="816" font-size="15" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >→ 두 패드를 엄지 쪽으로 1cm</text>
<circle cx="70" cy="849" r="5" fill="#a93226"/>
<text x="86" y="854" font-size="15" text-anchor="start" fill="#a93226" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">손목이 새끼손가락 쪽으로 꺾임</text>
<text x="370" y="854" font-size="15" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >→ 두 패드를 엄지 쪽으로 1cm</text>
<circle cx="70" cy="887" r="5" fill="#a93226"/>
<text x="86" y="892" font-size="15" text-anchor="start" fill="#a93226" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">찌릿하기만 하고 안 움직임</text>
<text x="370" y="892" font-size="15" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >→ 패드 A를 팔꿈치 쪽으로 1cm, 피부에 물 한 방울</text>
<circle cx="70" cy="925" r="5" fill="#a93226"/>
<text x="86" y="930" font-size="15" text-anchor="start" fill="#a93226" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">한 점만 콕콕 따가움</text>
<text x="370" y="930" font-size="15" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >→ 패드가 들떴음. 다시 붙이거나 새 패드</text>
<circle cx="70" cy="963" r="5" fill="#555"/>
<text x="86" y="968" font-size="15" text-anchor="start" fill="#555" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">반응이 약하면</text>
<text x="370" y="968" font-size="15" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >→ 리드 빨강·검정을 서로 바꿔 꽂아 본다</text>
<text x="60" y="1020" font-size="14" text-anchor="start" fill="#c0392b" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">피할 곳: 팔꿈치 접히는 곳, 뼈 바로 위, 손목 가까운 힘줄 부위, 상처·점 위</text>
<rect x="1000" y="580" width="475" height="470" rx="14" fill="#fff" stroke="#cfc6b4" stroke-width="1.5"/>
<text x="1020" y="616" font-size="19" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">나중에: CH2 삼두근 (위팔 뒤)</text>
<text x="1020" y="640" font-size="13" text-anchor="start" fill="#555" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >팔을 내린 상태에서 뒤에서 본 모습</text>
<path d="M1170,670 Q1150,830 1175,990 L1300,990 Q1322,830 1300,670 Z" fill="#f3d3bb" stroke="#c99a7a" stroke-width="2.5"/>
<ellipse cx="1236" cy="830" rx="52" ry="130" fill="#e74c3c33"/>
<text x="1236" y="662" font-size="13" text-anchor="middle" fill="#7a4d2c" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >어깨</text>
<text x="1236" y="1012" font-size="13" text-anchor="middle" fill="#7a4d2c" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >팔꿈치</text>
<rect x="1213" y="699" width="46" height="112" rx="10" fill="#ffffffcc" stroke="#44617e" stroke-width="3"/>
<rect x="1219" y="705" width="34" height="100" rx="7" fill="#8fa7bf88"/>
<text x="1236" y="762" font-size="20" text-anchor="middle" fill="#1e3a56" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">A</text>
<rect x="1213" y="844" width="46" height="112" rx="10" fill="#ffffffcc" stroke="#44617e" stroke-width="3"/>
<rect x="1219" y="850" width="34" height="100" rx="7" fill="#8fa7bf88"/>
<text x="1236" y="907" font-size="20" text-anchor="middle" fill="#1e3a56" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">B</text>
<text x="1330" y="760" font-size="14" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">5×10cm 패드 2장</text>
<text x="1330" y="784" font-size="13" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >근육 결 따라 세로로</text>
<text x="1330" y="830" font-size="13" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >패드 사이 2~3cm</text>
<text x="1330" y="876" font-size="13" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >팔꿈치에서 손 한 뼘</text>
<text x="1330" y="896" font-size="13" text-anchor="start" fill="#222" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >위까지가 근육 중심</text>
<text x="1020" y="1035" font-size="13" text-anchor="start" fill="#555" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" >팔꿈치를 펴며 힘주면 위팔 뒤가 단단해지는 곳</text>
</svg>